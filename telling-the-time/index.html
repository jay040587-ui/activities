<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Telling the time</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Nunito:ital,wght@0,400;0,700;0,800;1,400&family=Baloo+2:wght@500;700&family=Lilita+One&family=Chewy&family=Bangers&family=Permanent+Marker&family=Caveat:wght@500;700&family=Patrick+Hand&family=Gochi+Hand&family=Pacifico&family=Righteous&family=Bebas+Neue&family=Rubik:wght@400;600;800&family=Pirata+One&family=Special+Elite&family=Amatic+SC:wght@700&family=Press+Start+2P&family=Playfair+Display:wght@600;800&display=swap"><style>html,body{margin:0;height:100%;background:#0d0f17}.kz-page{position:absolute;left:0;top:0;width:960px;height:540px;overflow:hidden;font-family:var(--fb);color:var(--ink);-webkit-font-smoothing:antialiased}
.kz-page *{box-sizing:border-box}
.kz-pat{position:absolute;inset:0;pointer-events:none}
.kz-el{position:absolute}
.kz-a,.kz-l,.kz-b{position:absolute;inset:0}
.kz-b{container-type:size;transition:transform .25s cubic-bezier(.3,1.5,.5,1),filter .25s ease}
.kz-txt{white-space:pre-line;position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;overflow-wrap:anywhere;line-height:1.2;outline:none}
.kz-txt p,.kz-txt div{margin:0}
.kz-svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.kz-svg .f{fill:var(--f);stroke:var(--st,none);stroke-width:var(--sw,0);vector-effect:non-scaling-stroke;stroke-linejoin:round}
.kz-svg .s{fill:var(--s);stroke:var(--st,none);stroke-width:var(--sw,0);vector-effect:non-scaling-stroke;stroke-linejoin:round}
.kz-svg .o{fill:none;stroke:var(--f);stroke-width:var(--lw,8);vector-effect:non-scaling-stroke;stroke-linecap:round;stroke-linejoin:round}
.kz-ico{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.kz-ico *{fill:none;stroke:var(--f);stroke-width:var(--lw,6);vector-effect:non-scaling-stroke;stroke-linecap:round;stroke-linejoin:round}
.kz-ico.fl *{fill:var(--f)}
.kz-cs{position:absolute;inset:0;background:var(--f)}
.kz-cs-round{border-radius:24px}.kz-cs-circle{border-radius:50%}.kz-cs-pill{border-radius:999px}
.kz-cs-btn3d{border-radius:20px;box-shadow:0 8px 0 var(--s),0 14px 18px -8px rgba(0,0,0,.35)}
.kz-cs-sticky{background:linear-gradient(225deg,transparent 0 22px,var(--f) 22px);box-shadow:0 14px 16px -12px rgba(0,0,0,.5)}
.kz-cs-sticky::after{content:"";position:absolute;top:0;right:0;width:31px;height:31px;background:linear-gradient(225deg,transparent 50%,var(--s) 50%);border-bottom-left-radius:4px}
.kz-cs-chalk{border-radius:10px;border:12px solid #9a6a3c;box-shadow:inset 0 0 40px rgba(0,0,0,.35),0 6px 0 #6e4826}
.kz-cs-frame{background:transparent;border:10px solid var(--f);border-radius:14px}
.kz-cs-glass{background:color-mix(in srgb,var(--f) 35%,transparent);backdrop-filter:blur(8px);border:2px solid rgba(255,255,255,.6);border-radius:22px}
.kz-cs-tape{opacity:.88;clip-path:polygon(2% 0,98% 0,100% 20%,97% 40%,100% 60%,97% 80%,100% 100%,2% 100%,0 80%,3% 60%,0 40%,3% 20%)}
.kz-emo{position:absolute;inset:0;display:grid;place-items:center;font-size:86cqmin;line-height:1;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;user-select:none}
.kz-img{position:absolute;inset:0;overflow:hidden}
.kz-img img{width:100%;height:100%;display:block;user-select:none;-webkit-user-drag:none}
.kz-img.fr-round{border-radius:20px}.kz-img.fr-circle{border-radius:50%}
.kz-img.fr-sticker{border:7px solid #fff;border-radius:18px;box-shadow:0 8px 16px -6px rgba(0,0,0,.4)}
.kz-img.fr-polaroid{background:#fff;padding:5% 5% 18%;overflow:visible;box-shadow:0 12px 20px -10px rgba(0,0,0,.5)}
.kz-img.fr-polaroid img{border-radius:2px}
.kz-img .cap{position:absolute;left:0;right:0;bottom:3%;text-align:center;font-family:"Caveat",cursive;font-size:11cqh;color:#333;line-height:1}
.kz-img.fr-tape{overflow:visible;box-shadow:0 8px 14px -8px rgba(0,0,0,.45)}
.kz-img.fr-tape::before{content:"";position:absolute;z-index:2;top:-14px;left:50%;width:34%;height:30px;transform:translateX(-50%) rotate(-3deg);background:rgba(255,236,170,.85);clip-path:polygon(2% 0,98% 0,100% 30%,97% 60%,100% 100%,2% 100%,0 70%,3% 35%)}
.kz-img-empty{position:absolute;inset:0;border:3px dashed color-mix(in srgb,var(--ink) 40%,transparent);border-radius:16px;display:grid;place-items:center;font:600 15px var(--fb);color:color-mix(in srgb,var(--ink) 60%,transparent)}
/* presets */
.kz-flip{position:absolute;inset:0;perspective:1000px}
.kz-flip-in{position:absolute;inset:0;transition:transform .7s cubic-bezier(.3,1.3,.5,1);transform-style:preserve-3d}
.kz-flip.on .kz-flip-in{transform:rotateY(180deg)}
.kz-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3cqh;padding:6cqh 6cqw;text-align:center;color:var(--tc);box-shadow:0 7px 0 color-mix(in srgb,var(--bgx) 70%,#000);background:var(--bgx)}
.kz-face.front{--bgx:var(--fc)}
.kz-face.back{--bgx:var(--bc);transform:rotateY(180deg)}
.kz-face .em{font-size:44cqh;line-height:1;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.kz-face .tx{font-size:13cqh;line-height:1.1;font-weight:700}
.kz-face .tx.solo{font-size:17cqh}
.kz-face::after{content:"";position:absolute;inset:7px;border:2px dashed rgba(255,255,255,.45);border-radius:16px;pointer-events:none}
.kz-vocab{position:absolute;inset:0;border-radius:24px;background:var(--c);border:4px solid var(--ac);box-shadow:0 8px 0 color-mix(in srgb,var(--ac) 75%,#000);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2cqh;padding:6cqh 6cqw;text-align:center;color:var(--tc)}
.kz-vocab .em{font-size:32cqh;line-height:1.05;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.kz-vocab .pic{width:70%;height:40cqh;object-fit:contain}
.kz-vocab .w{font-size:12cqh;font-weight:700;line-height:1.05}
.kz-vocab .ph{font-size:6.5cqh;opacity:.65;font-family:"Nunito",system-ui,sans-serif}
.kz-vocab .tr{font-size:7.5cqh;padding:1cqh 5cqw;border-radius:99px;background:color-mix(in srgb,var(--ac) 18%,transparent);transition:filter .3s,opacity .3s}
.kz-vocab.hid .tr{filter:blur(7px);opacity:.6}
.kz-say{position:absolute;top:4cqh;right:4cqh;width:15cqh;height:15cqh;border-radius:50%;border:0;background:var(--ac);color:#fff;display:grid;place-items:center;cursor:pointer;padding:0;box-shadow:0 3px 0 color-mix(in srgb,var(--ac) 65%,#000)}
.kz-say svg{width:58%;height:58%;fill:none;stroke:#fff;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.kz-quiz{position:absolute;inset:0;border-radius:26px;background:var(--c);padding:5cqh 4cqw;display:flex;flex-direction:column;gap:4cqh;box-shadow:0 8px 0 rgba(0,0,0,.14);color:var(--tc)}
.kz-quiz .q{font-size:calc(8.5cqh*var(--qz,1));font-weight:700;text-align:center;line-height:1.15}
.kz-quiz .opts{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:3.5cqh 2cqw}
.kz-opt{border:0;border-radius:16px;font:inherit;font-size:calc(6.5cqh*var(--qz,1));font-weight:700;color:#fff;background:var(--oc);box-shadow:0 6px 0 color-mix(in srgb,var(--oc) 62%,#000);display:flex;align-items:center;gap:2cqw;padding:0 3cqw;text-align:left;cursor:pointer;transition:transform .15s,background .3s,opacity .3s}
.kz-opt .k{flex:none;width:10cqh;height:10cqh;border-radius:50%;background:rgba(255,255,255,.28);display:grid;place-items:center;font-size:5.5cqh}
.kz-play .kz-opt:hover{transform:translateY(-3px)}
.kz-opt.ok{background:#1f9d55;box-shadow:0 6px 0 #146b3a;animation:kz-beat .7s}
.kz-opt.ko{background:#8b909c;box-shadow:0 6px 0 #5d616b;animation:kz-shake .45s}
.kz-opt.dim{opacity:.45}
.kz-quiz .fb{min-height:7cqh;text-align:center;font-size:6.5cqh;font-weight:700}
.kz-lock{position:absolute;inset:0;border-radius:28px;background:var(--c);color:var(--tc);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3.5cqh;padding:5cqh 5cqw;box-shadow:0 9px 0 color-mix(in srgb,var(--c) 70%,#000)}
.kz-lock .ic{font-size:20cqh;line-height:1;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.kz-lock.open .ic{animation:kz-pop .6s}
.kz-lock .hint{font-size:6cqh;text-align:center;opacity:.85;max-width:90%}
.kz-wheels{display:flex;gap:2.5cqw}
.kz-wheel{display:flex;flex-direction:column;align-items:center;background:rgba(0,0,0,.22);border-radius:14px;padding:1cqh 0;width:min(13cqw,18cqh)}
.kz-wheel button{border:0;background:none;color:inherit;font-size:6cqh;cursor:pointer;padding:.5cqh 2cqw;opacity:.8}
.kz-wheel b{font:700 13cqh/1 "Nunito",system-ui,sans-serif;font-variant-numeric:tabular-nums}
.kz-lock .go{border:0;border-radius:99px;background:var(--ac);color:var(--bt);font:inherit;font-weight:700;font-size:6.5cqh;padding:1.6cqh 7cqw;cursor:pointer;box-shadow:0 5px 0 color-mix(in srgb,var(--ac) 60%,#000)}
.kz-lock.bad .kz-wheels{animation:kz-shake .45s}
.kz-timer{position:absolute;inset:0;display:grid;place-items:center;cursor:pointer}
.kz-timer svg{position:absolute;inset:0;width:100%;height:100%}
.kz-timer .t{position:relative;font:800 26cqmin/1 "Nunito",system-ui,sans-serif;font-variant-numeric:tabular-nums;color:var(--tc)}
.kz-timer .st{position:absolute;bottom:22%;font:700 8cqmin/1 "Nunito",sans-serif;color:var(--tc);opacity:.6}
.kz-timer.done{animation:kz-beat .8s 3}
/* modal */
.kz-modal{position:absolute;inset:0;z-index:900;background:rgba(12,14,30,.5);display:grid;place-items:center;animation:kz-fade .25s both}
.kz-modal .box{position:relative;min-width:340px;max-width:640px;max-height:84%;overflow:auto;background:var(--surf);color:var(--ink);border:4px solid var(--acc);border-radius:26px;padding:30px 38px 32px;text-align:center;box-shadow:0 12px 0 rgba(0,0,0,.18);animation:kz-pop .5s both;font-family:var(--fb)}
.kz-modal .em{font-size:66px;line-height:1.1;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.kz-modal h3{font-family:var(--fd);font-size:36px;margin:4px 0 8px;color:var(--acc);font-weight:700;line-height:1.1}
.kz-modal p{font-size:23px;line-height:1.45;margin:0}
.kz-modal .x{position:absolute;top:10px;right:12px;width:38px;height:38px;border-radius:50%;border:0;background:var(--acc);color:#fff;font-size:22px;line-height:1;cursor:pointer}
.kz-cf{position:absolute;top:-24px;width:11px;height:15px;z-index:950;border-radius:2px;pointer-events:none;animation:kz-cf var(--d) cubic-bezier(.25,.6,.4,1) forwards}
@keyframes kz-cf{to{transform:translate(var(--x),620px) rotate(var(--r))}}
/* play-mode affordances */
.kz-play .kz-click{cursor:pointer}
.kz-play .kz-h-grow:hover{transform:scale(1.08)}
.kz-play .kz-h-lift:hover{transform:translateY(-8px);filter:drop-shadow(0 12px 10px rgba(0,0,0,.25))}
.kz-play .kz-h-tilt:hover{transform:rotate(-5deg) scale(1.04)}
.kz-play .kz-h-glow:hover{filter:drop-shadow(0 0 14px var(--acc)) drop-shadow(0 0 4px var(--acc))}
.kz-play .kz-h-shake:hover{animation:kz-shake .45s}
.kz-play .kz-flip,.kz-play .kz-vocab{cursor:pointer}
/* entry */
@keyframes kz-fade{from{opacity:0}}
@keyframes kz-pop{0%{opacity:0;transform:scale(.3)}55%{opacity:1;transform:scale(1.1)}75%{transform:scale(.96)}100%{transform:none}}
@keyframes kz-up{from{opacity:0;transform:translateY(70px)}}
@keyframes kz-down{from{opacity:0;transform:translateY(-70px)}}
@keyframes kz-left{from{opacity:0;transform:translateX(110px)}}
@keyframes kz-right{from{opacity:0;transform:translateX(-110px)}}
@keyframes kz-zoom{from{opacity:0;transform:scale(1.8)}}
@keyframes kz-drop{0%{opacity:0;transform:translateY(-320px)}45%{opacity:1;transform:none}62%{transform:translateY(-34px)}78%{transform:none}90%{transform:translateY(-8px)}100%{transform:none}}
@keyframes kz-spin{from{opacity:0;transform:rotate(-220deg) scale(.2)}}
@keyframes kz-flipin{from{opacity:0;transform:perspective(700px) rotateY(95deg)}}
@keyframes kz-swing{0%{opacity:0;transform:rotate(-28deg)}40%{opacity:1;transform:rotate(14deg)}65%{transform:rotate(-7deg)}85%{transform:rotate(3deg)}100%{transform:none}}
/* loops */
@keyframes kz-float{50%{transform:translateY(-12px)}}
@keyframes kz-pulse{50%{transform:scale(1.09)}}
@keyframes kz-wiggle{25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
@keyframes kz-rot{to{transform:rotate(360deg)}}
@keyframes kz-bounce{0%,100%{transform:none}30%{transform:translateY(-20px)}50%{transform:none}65%{transform:translateY(-7px)}80%{transform:none}}
@keyframes kz-beat{0%,100%{transform:none}15%{transform:scale(1.12)}30%{transform:none}45%{transform:scale(1.07)}}
@keyframes kz-shake{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
@keyframes kz-sway{50%{transform:translateX(14px) rotate(2deg)}}
/* player */
.kz-player{position:absolute;inset:0;display:flex;flex-direction:column;background:#0d0f17;color:#fff;font-family:"Nunito",system-ui,sans-serif;user-select:none}
.kz-viewport{flex:1;position:relative;overflow:hidden;min-height:0}
.kz-stage{position:absolute;left:0;top:0;width:960px;height:540px;transform-origin:0 0;overflow:hidden;border-radius:8px;box-shadow:0 20px 60px rgba(0,0,0,.5);background:#000}
.kz-nav{flex:none;height:60px;display:flex;align-items:center;justify-content:center;gap:16px;padding:0 16px}
.kz-nav button{width:42px;height:42px;border-radius:50%;border:0;background:rgba(255,255,255,.12);color:#fff;font-size:18px;cursor:pointer;display:grid;place-items:center}
.kz-nav button:hover{background:rgba(255,255,255,.22)}
.kz-nav button:disabled{opacity:.3;cursor:default}
.kz-nav button svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.kz-dots{display:flex;gap:7px;align-items:center;flex-wrap:wrap;justify-content:center;max-width:60%}
.kz-nav .kz-dot{width:9px;height:9px;border-radius:5px;background:rgba(255,255,255,.3);border:0;padding:0;cursor:pointer;transition:width .3s,background .3s}
.kz-nav .kz-dot.on{width:26px;background:#fff}
.kz-nav .sp{flex:1}
.kz-in-slide{animation:kz-ti-slide .65s cubic-bezier(.2,.8,.2,1) both}
.kz-out-slide{animation:kz-to-slide .65s cubic-bezier(.2,.8,.2,1) both}
@keyframes kz-ti-slide{from{transform:translateX(calc(var(--dir,1)*100%))}}
@keyframes kz-to-slide{to{transform:translateX(calc(var(--dir,1)*-100%))}}
.kz-in-fade{animation:kz-fade .6s both}
.kz-out-fade{animation:kz-ti-out .6s both}
@keyframes kz-ti-out{to{opacity:0}}
.kz-in-zoom{animation:kz-ti-zoom .6s cubic-bezier(.2,.8,.2,1) both}
.kz-out-zoom{animation:kz-to-zoom .6s ease both}
@keyframes kz-ti-zoom{from{opacity:0;transform:scale(.6)}}
@keyframes kz-to-zoom{to{opacity:0;transform:scale(1.35)}}
.kz-in-flip{animation:kz-ti-flip .4s .3s ease-out both}
.kz-out-flip{animation:kz-to-flip .3s ease-in both}
@keyframes kz-ti-flip{from{transform:perspective(1600px) rotateY(calc(var(--dir,1)*-90deg))}}
@keyframes kz-to-flip{to{transform:perspective(1600px) rotateY(calc(var(--dir,1)*90deg))}}
.kz-in-cover{z-index:2;animation:kz-ti-cover .7s cubic-bezier(.3,1.3,.5,1) both}
.kz-out-cover{animation:kz-ti-out .7s both}
@keyframes kz-ti-cover{from{transform:translateY(-100%)}}
.kz-leaving{pointer-events:none}
@media (prefers-reduced-motion:reduce){.kz-a,.kz-l,.kz-page,.kz-cf{animation:none!important}.kz-cf{display:none}}
/* shape styles */
.kz-svg .f,.kz-svg .s,.kz-svg .b{stroke:var(--st,none);stroke-width:var(--sw,0);vector-effect:non-scaling-stroke;stroke-linejoin:round}
.kz-svg.grad .f{fill:var(--gr)}
.kz-svg .gls *{fill:var(--gl);stroke:none}
.kz-svg .l{fill:color-mix(in srgb,var(--f) 42%,#fff)}
.kz-svg .d{fill:color-mix(in srgb,var(--f) 55%,#000)}
.kz-svg .h{fill:#fff;opacity:.3}
.kz-svg .w{fill:#fff}
.kz-svg .k{fill:var(--k)}
.kz-svg .b{fill:var(--f2)}
.kz-svg .b2{fill:color-mix(in srgb,var(--f2) 68%,#000);stroke:var(--st,none);stroke-width:var(--sw,0);vector-effect:non-scaling-stroke}
.kz-svg .kd{fill:none;stroke:#fff;stroke-width:2;stroke-dasharray:7 5;vector-effect:non-scaling-stroke;opacity:.8}
.kz-svg .kf{fill:none;stroke:var(--f);stroke-width:2.5;stroke-dasharray:5 4;vector-effect:non-scaling-stroke}
.kz-svg .kl{fill:none;stroke:var(--k);stroke-width:2;vector-effect:non-scaling-stroke;opacity:.28}
.kz-svg .tr{fill:var(--f2);opacity:.55}.kz-svg .tr2{fill:var(--f);opacity:.4}
.kz-svg .nl{fill:none;stroke:#8dbbe8;stroke-width:1.5;vector-effect:non-scaling-stroke}
.kz-svg .nm{fill:none;stroke:#ff8585;stroke-width:2;vector-effect:non-scaling-stroke}
.st-sticker .kz-svg .f,.st-sticker .kz-svg .s,.st-sticker .kz-svg .b,.st-sticker .kz-svg .b2{paint-order:stroke}
.st-pop .kz-cs,.st-3d .kz-cs{background:linear-gradient(180deg,color-mix(in srgb,var(--f) 55%,#fff) 0%,var(--f) 52%,color-mix(in srgb,var(--f) 80%,#000) 100%)}
.st-pop .kz-cs::before,.st-3d .kz-cs::before{content:"";position:absolute;left:7%;right:7%;top:5%;height:40%;border-radius:inherit;background:linear-gradient(rgba(255,255,255,.55),rgba(255,255,255,0));pointer-events:none}
.st-pop .kz-cs{border:3px solid var(--k)}
.st-bd .kz-cs{border:4.5px solid #15161c}
.st-sticker .kz-cs{border:6px solid #fff}
.st-doodle .kz-cs{border:3px solid var(--k);border-radius:255px 18px 225px 18px/18px 225px 18px 255px}
.st-doodle .kz-cs-circle{border-radius:48% 52% 45% 55%/55% 45% 52% 48%}
.st-3d .kz-cs-btn3d,.st-pop .kz-cs-btn3d{box-shadow:inset 0 -6px 0 rgba(0,0,0,.18)}
.st-bd .kz-txt,.st-pop .kz-txt{font-weight:700}
/* icon styles */
.kz-ico.ist-duo *{fill:color-mix(in srgb,var(--f) 26%,transparent)}
.kz-ico .n,.kz-ico.fl .n{fill:none!important}
.kz-ico .ibg{stroke:none;vector-effect:none}
.kz-ico.ist-sticker .ibg{stroke:#fff;stroke-width:1.6;paint-order:stroke}
.kz-ico .igl{fill:#fff;opacity:.3;stroke:none}
.kz-ico .ifg *{stroke:var(--fg);fill:none}
.kz-ico.fl .ifg *{fill:var(--fg)}

/* games & widgets */
.kz-btn{border:0;border-radius:99px;background:var(--ac);color:var(--on);font:inherit;font-weight:700;font-size:15px;padding:9px 22px;cursor:pointer;box-shadow:0 4px 0 color-mix(in srgb,var(--ac) 60%,#000);transition:transform .15s}
.kz-btn:hover{transform:translateY(-2px)}.kz-btn.alt{background:var(--tc);color:var(--c);box-shadow:0 4px 0 rgba(0,0,0,.3)}
.kz-win{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#1f9d55;color:#fff;font-weight:800;font-size:26px;padding:12px 28px;border-radius:18px;box-shadow:0 8px 0 #146b3a,0 20px 30px rgba(0,0,0,.25);animation:kz-pop .6s both;z-index:5;white-space:nowrap}
.kz-wheel2{position:absolute;inset:0;display:grid;place-items:center}
